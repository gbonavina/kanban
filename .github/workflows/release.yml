# Builds the desktop app for Linux and Windows.
#
# - Push a tag like v1.2.0 to build both and publish them as a GitHub Release.
# - Or run it by hand from the Actions tab ("Run workflow") to get the files
#   as downloadable build artifacts without making a release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm test

      # Name the files after the tag (v1.2.0 -> 1.2.0) instead of package.json's version.
      - name: Use the tag as the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - run: npm run dist

      # The single-file version is the same on every OS, so it's built once.
      - name: Build the single HTML file
        if: runner.os == 'Linux'
        run: npm run build:html

      - uses: actions/upload-artifact@v7
        with:
          name: minha-rotina-${{ runner.os }}
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            dist-html/minha-rotina.html

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      # The artifacts keep their folders (release/…, dist-html/…), so match at any depth.
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            release/**/*.AppImage
            release/**/*.deb
            release/**/*.exe
            release/**/*.html
          generate_release_notes: true
